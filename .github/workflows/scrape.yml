name: Scrape jobs

on:
  schedule:
    # 04:00, 10:00, 16:00 UTC = 07:00, 13:00, 19:00 Israel. Apify sources (Google, Facebook)
    # run only on the first slot of the UTC day to stay inside the free credit.
    - cron: "0 4,10,16 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated sources (google,linkedin,alljobs,drushim,jobmaster,gotfriends,ats,facebook). Empty = all."
        required: false
      force_apify:
        description: "Run Apify sources (Google, Facebook) even outside their daily slot"
        type: boolean
        default: false

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Scrape, score and email
        run: npm run scrape -- ${{ inputs.only && format('--only={0}', inputs.only) || '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          FORCE_APIFY: ${{ inputs.force_apify && '1' || '' }}
